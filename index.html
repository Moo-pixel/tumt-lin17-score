<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="林憶青老師班級成績查詢系統"
    >

    <title>林憶青老師班級成績查詢系統</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 20px;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft JhengHei",
                "Noto Sans TC",
                Arial,
                sans-serif;

            background-color: #eef3f8;
            color: #2d3748;
        }

        .container {
            width: 100%;
            max-width: 560px;

            padding: 32px 30px;

            background-color: #ffffff;
            border-radius: 18px;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.09);
        }

        .logo-area {
            display: flex;
            justify-content: center;
            align-items: center;

            width: 100%;
            margin-bottom: 22px;
        }

        .school-logo {
            display: block;

            width: 300px;
            max-width: 95%;
            height: auto;

            margin: 0 auto;

            object-fit: contain;
        }

        h1 {
            margin: 0 0 10px;

            color: #163a63;

            font-size: 25px;
            line-height: 1.45;
            font-weight: 700;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 28px;

            color: #5f6f81;

            font-size: 15px;
            line-height: 1.7;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 9px;

            color: #374151;

            font-size: 15px;
            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border: 1.5px solid #cbd5e1;
            border-radius: 9px;

            background-color: #ffffff;
            color: #1f2937;

            font-family: inherit;
            font-size: 16px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        input:focus {
            outline: none;

            border-color: #3182ce;

            box-shadow:
                0 0 0 3px rgba(49, 130, 206, 0.16);
        }

        input:disabled {
            background-color: #edf2f7;
            cursor: not-allowed;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 9px;

            background-color: #3182ce;
            color: #ffffff;

            font-family: inherit;
            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background-color 0.2s,
                opacity 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #286cad;
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
        }

        button:disabled {
            background-color: #9fb3c8;
            cursor: not-allowed;
        }

        #loading {
            display: none;

            margin: 22px 0 0;

            color: #526273;

            font-size: 15px;
            font-weight: 500;
            line-height: 1.6;
            text-align: center;
        }

        #result {
            display: none;

            margin-top: 25px;
            padding: 22px;

            border: 1px solid #dce5ee;
            border-radius: 11px;

            background-color: #f8fafc;
        }

        .result-title {
            margin-bottom: 12px;
            padding-bottom: 13px;

            border-bottom: 2px solid #3182ce;

            color: #25364a;

            font-size: 20px;
            font-weight: 700;
            line-height: 1.5;
            text-align: center;
        }

        .semester-tag {
            display: inline-block;

            margin-top: 8px;
            padding: 4px 10px;

            border-radius: 5px;

            background-color: #e2e8f0;
            color: #526273;

            font-size: 13px;
            font-weight: 400;
        }

        .score-row {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
            align-items: start;

            gap: 18px;

            padding: 12px 0;

            border-bottom: 1px dashed #d6dee8;
        }

        .score-row:last-child {
            border-bottom: none;
        }

        .score-label {
            color: #526273;

            font-size: 15px;
            line-height: 1.55;

            overflow-wrap: anywhere;
        }

        .score-value {
            color: #1f2937;

            font-size: 16px;
            font-weight: 700;
            line-height: 1.55;
            text-align: right;

            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .error {
            padding: 14px;

            border: 1px solid #fecaca;
            border-radius: 8px;

            background-color: #fff5f5;
            color: #c53030;

            font-size: 15px;
            font-weight: 700;
            line-height: 1.65;
            text-align: center;
        }

        .notice {
            margin-top: 22px;

            color: #718096;

            font-size: 13px;
            line-height: 1.75;
            text-align: center;
        }

        .footer {
            margin-top: 27px;

            color: #9aa8b6;

            font-size: 12px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        @media screen and (max-width: 600px) {
            body {
                padding:
                    max(12px, env(safe-area-inset-top))
                    max(10px, env(safe-area-inset-right))
                    max(12px, env(safe-area-inset-bottom))
                    max(10px, env(safe-area-inset-left));

                align-items: flex-start;
            }

            .container {
                margin-top: 12px;
                padding: 26px 18px;

                border-radius: 16px;
            }

            .logo-area {
                margin-bottom: 20px;
            }

            .school-logo {
                width: 285px;
                max-width: 96%;
            }

            h1 {
                font-size: 22px;
            }

            .subtitle {
                margin-bottom: 24px;
                font-size: 14px;
            }

            input {
                min-height: 48px;
            }

            button {
                min-height: 50px;
            }

            #result {
                padding: 18px 16px;
            }

            .result-title {
                font-size: 19px;
            }

            .score-row {
                grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
                gap: 12px;
            }

            .score-label {
                font-size: 14px;
            }

            .score-value {
                font-size: 15px;
            }
        }

        @media screen and (max-width: 380px) {
            .container {
                padding: 23px 14px;
            }

            .school-logo {
                width: 270px;
            }

            h1 {
                font-size: 20px;
            }

            #result {
                padding: 16px 13px;
            }

            .score-row {
                gap: 8px;
            }

            .score-label,
            .score-value {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo-area">
            <img
                src="logo.png"
                alt="台北海洋科技大學標誌"
                class="school-logo"
            >
        </div>

        <h1>
            林憶青老師班級成績查詢系統
        </h1>

        <div
            class="subtitle"
            id="querySubtitle"
        >
            請輸入學號查詢目前學期成績
        </div>

        <form id="queryForm">

            <div class="form-group">

                <label for="studentId">
                    學號
                </label>

                <input
                    type="text"
                    id="studentId"
                    name="studentId"
                    placeholder="請輸入學號"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    maxlength="50"
                    required
                >

            </div>

            <button
                type="submit"
                id="queryButton"
            >
                送出查詢
            </button>

        </form>

        <div
            id="loading"
            role="status"
            aria-live="polite"
        >
            正在查詢成績資料……
        </div>

        <section
            id="result"
            aria-live="polite"
            aria-atomic="true"
        ></section>

        <div
            class="notice"
            id="notice"
        >
            本系統僅供班級學生查詢個人成績使用。<br>
            請勿代替他人查詢或轉傳成績資料。
        </div>

        <div class="footer">
            Grade Inquiry System
        </div>

    </main>

    <script>
        /*
         * 請貼上最新部署的 GAS 網頁應用程式網址。
         * 網址必須以 /exec 結尾。
         */
        const GAS_API_URL =
            "https://script.google.com/macros/s/AKfycbwYYa3UQoBP-p3dyluLdUDfsZGBqL7K6E7RlODNUZTD8WmL8PmoIPr0CxghF8xSjVXI/exec";


        const queryForm =
            document.getElementById("queryForm");

        const querySubtitle =
            document.getElementById("querySubtitle");

        const studentIdInput =
            document.getElementById("studentId");

        const queryButton =
            document.getElementById("queryButton");

        const loadingDiv =
            document.getElementById("loading");

        const resultDiv =
            document.getElementById("result");

        const noticeDiv =
            document.getElementById("notice");


        queryForm.addEventListener(
            "submit",
            function (event) {
                event.preventDefault();
                queryScore();
            }
        );


        async function queryScore() {

            const studentId =
                studentIdInput.value.trim();


            if (studentId === "") {
                alert("請輸入學號！");
                studentIdInput.focus();
                return;
            }


            if (
                !GAS_API_URL.startsWith(
                    "https://script.google.com/macros/s/"
                ) ||
                !GAS_API_URL.endsWith("/exec")
            ) {
                showError(
                    "尚未設定正確的 GAS 網頁應用程式網址。"
                );

                return;
            }


            clearResult();
            setLoading(true);


            const controller =
                new AbortController();


            const timeoutId =
                window.setTimeout(
                    function () {
                        controller.abort();
                    },
                    15000
                );


            try {

                const response =
                    await fetch(
                        GAS_API_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "text/plain;charset=utf-8"
                            },

                            body: JSON.stringify({
                                id: studentId
                            }),

                            signal: controller.signal,

                            redirect: "follow",

                            cache: "no-store",

                            referrerPolicy:
                                "no-referrer"
                        }
                    );


                if (!response.ok) {
                    throw new Error(
                        "HTTP 錯誤：" +
                        response.status
                    );
                }


                const responseText =
                    await response.text();


                let responseData;


                try {
                    responseData =
                        JSON.parse(responseText);
                } catch (jsonError) {
                    throw new Error(
                        "伺服器未回傳正確的 JSON。"
                    );
                }


                if (
                    responseData.status ===
                    "success"
                ) {
                    showScore(responseData);
                } else {
                    showError(
                        responseData.message ||
                        "查詢失敗，請稍後再試。"
                    );
                }

            } catch (error) {

                console.error(error);


                if (
                    error.name ===
                    "AbortError"
                ) {
                    showError(
                        "連線逾時，請稍後重新查詢。"
                    );
                } else {
                    showError(
                        "連線失敗，請檢查網路或系統設定。"
                    );
                }

            } finally {

                window.clearTimeout(
                    timeoutId
                );

                setLoading(false);
            }
        }


        function showScore(responseData) {

            if (
                !Array.isArray(
                    responseData.headers
                ) ||
                typeof responseData.data
                    !== "object" ||
                responseData.data === null
            ) {
                showError(
                    "系統回傳的成績資料格式錯誤。"
                );

                return;
            }


            /*
             * 成功查詢後隱藏輸入區域。
             * 不提供再次查詢按鈕。
             */
            queryForm.classList.add("hidden");
            querySubtitle.classList.add("hidden");


            resultDiv.replaceChildren();


            const titleDiv =
                document.createElement("div");

            titleDiv.className =
                "result-title";


            const titleText =
                document.createElement("div");

            titleText.textContent =
                "當期成績單";


            const semesterTag =
                document.createElement("span");

            semesterTag.className =
                "semester-tag";

            semesterTag.textContent =
                "學期：" +
                String(
                    responseData.sheetName ||
                    "-"
                );


            titleDiv.appendChild(
                titleText
            );

            titleDiv.appendChild(
                semesterTag
            );

            resultDiv.appendChild(
                titleDiv
            );


            responseData.headers.forEach(
                function (header) {

                    const key =
                        String(header).trim();


                    if (key === "") {
                        return;
                    }


                    if (
                        !Object.prototype
                            .hasOwnProperty.call(
                                responseData.data,
                                key
                            )
                    ) {
                        return;
                    }


                    let value =
                        responseData.data[key];


                    if (
                        value === "" ||
                        value === null ||
                        value === undefined
                    ) {
                        value = "-";
                    }


                    const rowDiv =
                        document.createElement(
                            "div"
                        );

                    rowDiv.className =
                        "score-row";


                    const labelSpan =
                        document.createElement(
                            "span"
                        );

                    labelSpan.className =
                        "score-label";

                    labelSpan.textContent =
                        key;


                    const valueSpan =
                        document.createElement(
                            "span"
                        );

                    valueSpan.className =
                        "score-value";

                    valueSpan.textContent =
                        String(value);


                    rowDiv.appendChild(
                        labelSpan
                    );

                    rowDiv.appendChild(
                        valueSpan
                    );

                    resultDiv.appendChild(
                        rowDiv
                    );
                }
            );


            resultDiv.style.display =
                "block";


            /*
             * 查詢成功後將畫面捲到成績區。
             * 手機版使用時較方便。
             */
            window.setTimeout(
                function () {
                    resultDiv.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });
                },
                100
            );
        }


        function showError(message) {

            resultDiv.replaceChildren();


            const errorDiv =
                document.createElement("div");

            errorDiv.className =
                "error";

            errorDiv.textContent =
                "❌ " + String(message);


            resultDiv.appendChild(
                errorDiv
            );

            resultDiv.style.display =
                "block";
        }


        function clearResult() {

            resultDiv.replaceChildren();

            resultDiv.style.display =
                "none";
        }


        function setLoading(isLoading) {

            loadingDiv.style.display =
                isLoading
                    ? "block"
                    : "none";


            queryButton.disabled =
                isLoading;


            studentIdInput.disabled =
                isLoading;


            queryButton.textContent =
                isLoading
                    ? "查詢中……"
                    : "送出查詢";
        }
    </script>

</body>
</html>
